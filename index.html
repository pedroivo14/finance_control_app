                                                        }
                                                    });

                                                    const sortedInvoiceKeys = Object.keys(invoices).sort((a, b) => a.localeCompare(b));

                                                    if (sortedInvoiceKeys.length === 0) {
                                                        return <div className="text-center text-xs text-gray-400 py-4">Nenhum lançamento para este cartão.</div>;
                                                    }

                                                    return (
                                                        <div className="space-y-3 mt-4">
                                                            {sortedInvoiceKeys.map(invoiceKey => {
                                                                const [year, month] = invoiceKey.split('-');
                                                                const invoiceData = invoices[invoiceKey];
                                                                const monthName = new Date(parseInt(year), parseInt(month), 1).toLocaleString('pt-BR', { month: 'long' });

                                                                return (
                                                                    <details key={invoiceKey} className="bg-gray-50 rounded-lg border border-gray-200">
                                                                        <summary className="p-3 font-semibold text-gray-700 cursor-pointer flex justify-between items-center list-none">
                                                                            <span className="capitalize">{`${monthName} ${year}`}</span>
                                                                            <span className="font-bold text-red-500">{formatCurrency(invoiceData.total)}</span>
                                                                        </summary>
                                                                        <div className="p-3 border-t space-y-2 bg-white">
                                                                            {invoiceData.items.sort((a,b) => a.title.localeCompare(b.title)).map(item => (
                                                                                <div 
                                                                                    key={`${item.id}-${item.installmentNumber}`} 
                                                                                    className={`flex justify-between items-center text-sm border-l-4 pl-3 py-1 transition-colors ${selection.ids.includes(item.id) ? 'bg-blue-100 border-blue-500' : 'border-blue-400'}`}
                                                                                    onPointerDown={() => handlePointerDown(item.id)}
                                                                                    onPointerUp={() => handlePointerUp(item.id)}
                                                                                    onPointerLeave={handlePointerLeave}
                                                                                    style={{ touchAction: 'pan-y' }}
                                                                                >
                                                                                    <div>
                                                                                        <div className="font-medium text-gray-800">{item.title}</div>
                                                                                        {item.tags && item.tags.length > 0 && (
                                                                                            <div className="flex flex-wrap gap-1 mt-1.5">
                                                                                                {item.tags.map(tagId => {
                                                                                                    const tag = tags.find(t => t.id === tagId);
                                                                                                    return tag ? <span key={tagId} className="text-[10px] bg-gray-200 text-gray-700 font-medium px-2 py-0.5 rounded-full">{tag.name}</span> : null;
                                                                                                })}
                                                                                            </div>
                                                                                        )}
                                                                                        <div className="text-xs text-gray-500 mt-1.5 mb-1">
                                                                                            {item.installments > 1 ? `Parcela ${item.installmentNumber} de ${item.installments}` : `Pagamento único`}
                                                                                        </div>
                                                                                        {item.isReimbursed && item.reimbursementValue > 0 && (
                                                                                            <div className="text-xs text-green-700 font-semibold bg-green-100 px-2 py-0.5 rounded-full inline-block">
                                                                                                Reembolso: {formatCurrency(item.reimbursementValue)}
                                                                                            </div>
                                                                                        )}
                                                                                        
                                                                                        {item.description && (
                                                                                            <details className="mt-1">
                                                                                                <summary className="text-xs text-gray-500 cursor-pointer hover:underline list-none p-0">
                                                                                                    <span className="flex items-center"><i className="fas fa-info-circle mr-1"></i> Ver Detalhes</span>
                                                                                                </summary>
                                                                                                <div className="mt-2 p-2 bg-gray-100 rounded-lg border max-w-xs">
                                                                                                    {item.description.startsWith('data:image/') ? (
                                                                                                        <a href={item.description} target="_blank" rel="noopener noreferrer" title="Clique para ver a imagem completa">
                                                                                                            <img src={item.description} alt="Anexo da compra" className="max-w-full h-auto rounded-md shadow-sm" />
                                                                                                        </a>
                                                                                                    ) : (
                                                                                                        <p className="text-sm text-gray-800 whitespace-pre-wrap break-words">{item.description}</p>
                                                                                                    )}
                                                                                                </div>
                                                                                            </details>
                                                                                        )}
                                                                                    </div>
                                                                                    <div className="flex items-center gap-4">
                                                                                        <span className="font-bold text-gray-700">{formatCurrency(item.installmentValue)}</span>
                                                                                        <button onClick={() => setEditModal({ isOpen: true, item: expenses.find(e => e.id === item.id), type: 'expense' })} className="text-gray-300 hover:text-blue-500 text-xs"><i className="fas fa-pencil-alt"></i></button>
                                                                                        <button onClick={() => removeItem(setExpenses, expenses, item.id)} className="text-gray-300 hover:text-red-500"><i className="fas fa-times"></i></button>
                                                                                    </div>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    </details>
                                                                );
                                                            })}
                                                        </div>
                                                    );
                                                }
                                            )()}
                                        </div>
                                    </details>
                                )) : (
                                    <div className="text-center text-gray-500 mt-8">
                                        <i className="fas fa-credit-card text-4xl text-gray-300 mb-4"></i>
                                        <p className="font-semibold">Nenhum cartão cadastrado</p>
                                        <p className="text-sm">Adicione um cartão na aba "Cartões" para ver suas faturas.</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'configuracoes' && (
                            <div className="space-y-6 animate-fade-in">
                                <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h2 className="text-lg font-bold text-gray-800"><i className="fas fa-tags mr-2"></i>Gerenciar Tags</h2>
                                    <p className="text-xs text-gray-500 mt-1">Crie e gerencie tags para categorizar suas compras.</p>
                                </section>

                                <section className="bg-white p-4 rounded-xl shadow-sm">
                                    <h3 className="text-md font-bold mb-3 text-gray-800">Adicionar Nova Tag</h3>
                                    <form onSubmit={addTag} className="flex gap-2 mb-6">
                                        <input name="name" placeholder="Ex: Lazer, Alimentação, Viagem..." required className="flex-1 border border-gray-200 p-2 rounded-lg bg-gray-50 text-sm" />
                                        <button type="submit" className="bg-blue-600 text-white px-4 rounded-lg font-bold shadow-sm hover:bg-blue-700">Adicionar</button>
                                    </form>
                                    <h3 className="text-md font-bold mb-3 text-gray-800">Tags Existentes</h3>
                                    <div className="space-y-2">
                                        {tags.sort((a, b) => a.name.localeCompare(b.name)).map(tag => (
                                            <div key={tag.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                                                {editingTag.id === tag.id ? (
                                                    <form onSubmit={(e) => { e.preventDefault(); handleUpdateTag(); }} className="flex-1 flex items-center gap-3">
                                                        <input 
                                                            value={editingTag.name}
                                                            onChange={(e) => setEditingTag({ ...editingTag, name: e.target.value })}
                                                            className="flex-1 border border-gray-300 p-1.5 rounded-lg bg-white text-sm"
                                                            autoFocus
                                                        />
                                                        <button type="submit" className="text-green-500 hover:text-green-700"><i className="fas fa-check"></i></button>
                                                        <button type="button" onClick={() => setEditingTag({ id: null, name: '' })} className="text-red-500 hover:text-red-700"><i className="fas fa-times"></i></button>
                                                    </form>
                                                ) : (
                                                    <>
                                                        <span className="font-medium text-gray-700">{tag.name}</span>
                                                        <div className="flex items-center gap-4">
                                                            <button onClick={() => setEditingTag({ id: tag.id, name: tag.name })} className="text-gray-400 hover:text-blue-500 text-xs"><i className="fas fa-pencil-alt"></i></button>
                                                            <button onClick={() => removeTag(tag.id)} className="text-gray-400 hover:text-red-500"><i className="fas fa-trash"></i></button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        ))}
                                        {tags.length === 0 && <p className="text-center text-sm text-gray-400 py-4">Nenhuma tag criada.</p>}
                                    </div>
                                </section>

                                <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h2 className="text-lg font-bold text-gray-800"><i className="fas fa-cogs mr-2"></i>Outras Configurações</h2>
                                    <div className="mt-4">
                                        <label className="block text-xs font-semibold text-gray-500 uppercase">Nome para Compras sem Cartão (PIX, etc)</label>
                                        <input 
                                            value={pixLabel}
                                            onChange={(e) => setPixLabel(e.target.value)}
                                            className="w-full border p-2 rounded-lg bg-gray-50 text-sm mt-1" />
                                    </div>
                                </section>
                            </div>
                        )}

                        {activeTab === 'fixos' && (
                            <div className="space-y-6 animate-fade-in">
                                <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h2 className="text-md font-bold mb-3 text-purple-800"><i className="fas fa-crown mr-2"></i>Assinaturas (No Cartão)</h2>
                                    <form onSubmit={addSubscription} className="flex flex-col gap-2 mb-4">
                                        <input name="name" placeholder="Serviço (ex: Netflix)" required className="border p-2 rounded-lg bg-gray-50 text-sm" />
                                        <input name="desc" placeholder="Descrição do plano" className="border p-2 rounded-lg bg-gray-50 text-sm" />
                                        <div className="flex gap-2">
                                            <select name="cardId" required className="flex-1 border p-2 rounded-lg bg-gray-50 text-sm">
                                                <option value="">Qual cartão?</option>
                                                {cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                            <input name="value" type="number" step="0.01" placeholder="R$ Valor" required className="w-28 border p-2 rounded-lg bg-gray-50 text-sm" />
                                        </div>
                                        <button type="submit" className="bg-purple-600 text-white p-2 rounded-lg text-sm font-bold mt-1">Adicionar Assinatura</button>
                                    </form>
                                    <div className="space-y-2">
                                        {subscriptions.map(sub => (
                                            <div key={sub.id} className="flex justify-between items-center text-sm bg-purple-50 p-3 rounded-lg border border-purple-100">
                                                <div>
                                                    <div className="font-bold text-purple-900">{sub.name}</div>
                                                    <div className="text-xs text-purple-600">{cards.find(c=>c.id===sub.cardId)?.name} {sub.description ? `- ${sub.description}` : ''}</div>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <span className="font-bold text-purple-900">{formatCurrency(sub.value)}</span>
                                                    <button onClick={() => setEditModal({ isOpen: true, item: sub, type: 'subscription' })} className="text-purple-300 hover:text-blue-500 text-xs"><i className="fas fa-pencil-alt"></i></button>
                                                    <button onClick={() => removeItem(setSubscriptions, subscriptions, sub.id)} className="text-purple-300 hover:text-red-500"><i className="fas fa-times"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h2 className="text-md font-bold mb-3 text-teal-800"><i className="fas fa-home mr-2"></i>Gastos Recorrentes</h2>
                                    <p className="text-xs text-gray-500 mb-3">Gastos não atrelados a cartões (Aluguel, Luz, etc)</p>
                                    <form onSubmit={addRecurring} className="flex flex-col gap-2 mb-4" >
                                        <input name="title" placeholder="Título (ex: Aluguel)" required className="border p-2 rounded-lg bg-gray-50 text-sm" value={newRecurringData.title} onChange={handleNewRecurringChange} />
                                        <input name="description" placeholder="Descrição" className="border p-2 rounded-lg bg-gray-50 text-sm" value={newRecurringData.description} onChange={handleNewRecurringChange} />
                                        <div className="flex gap-2">
                                            <select name="recurrence" className="flex-1 border p-2 rounded-lg bg-gray-50 text-sm" value={newRecurringData.recurrence} onChange={handleNewRecurringChange}>
                                                <option value="Mensal">Mensal</option>
                                                <option value="Quinzenal">Quinzenal</option>
                                                <option value="Semanal">Semanal</option>
                                                <option value="Anual">Anual</option>
                                            </select>
                                            <input name="value" type="number" step="0.01" placeholder="R$ Valor" required className="w-28 border p-2 rounded-lg bg-gray-50 text-sm" value={newRecurringData.value} onChange={handleNewRecurringChange} />
                                        </div>
                                        {newRecurringData.recurrence === 'Quinzenal' && (
                                            <div className="mt-1">
                                                <label className="block text-[10px] font-bold text-gray-500 uppercase">Data de Referência (1ª cobrança)</label>
                                                <input name="date" type="date" className="w-full border p-2 rounded-lg bg-gray-50 text-sm" value={newRecurringData.date} onChange={handleNewRecurringChange} />
                                            </div>
                                        )}
                                        <button type="submit" className="bg-teal-600 text-white p-2 rounded-lg text-sm font-bold mt-1">Adicionar Gasto Fixo</button>
                                    </form>
                                    <div className="space-y-2">
                                        {recurring.map(rec => (
                                            <div key={rec.id} className="flex justify-between items-center text-sm bg-teal-50 p-3 rounded-lg border border-teal-100">
                                                <div>
                                                    <div className="font-bold text-teal-900">{rec.title} <span className="text-xs font-normal opacity-70">({rec.recurrence})</span></div>
                                                    <div className="text-xs text-teal-700">{rec.description}</div>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <span className="font-bold text-teal-900">{formatCurrency(rec.value)}</span>
                                                    <button onClick={() => setEditModal({ isOpen: true, item: rec, type: 'recurring' })} className="text-teal-300 hover:text-blue-500 text-xs"><i className="fas fa-pencil-alt"></i></button>
                                                    <button onClick={() => removeItem(setRecurring, recurring, rec.id)} className="text-teal-300 hover:text-red-500"><i className="fas fa-times"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}

                        {activeTab === 'simulador' && (
                            <div className="space-y-6 animate-fade-in">
                                <section className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                    <h2 className="text-lg font-bold mb-4 text-indigo-800"><i className="fas fa-balance-scale mr-2"></i>Cartão vs PIX</h2>
                                    <p className="text-xs text-gray-500 mb-4">Descubra qual a forma de pagamento que economiza mais dinheiro para você.</p>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase">Valor da Compra (R$)</label>
                                            <input type="number" name="price" value={sim.price} onChange={handleSimChange} className="w-full border-b-2 border-indigo-200 p-2 text-lg font-bold bg-indigo-50/30 outline-none focus:border-indigo-600" />
                                        </div>
                                        
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-500 uppercase">Quantos pontos por real?</label>
                                                <input type="number" step="0.1" name="pointsPerReal" value={sim.pointsPerReal} onChange={handleSimChange} className="w-full border p-2 rounded text-sm bg-gray-50" />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-500 uppercase">Valor do Ponto (R$)</label>
                                                <input type="number" step="0.001" name="cardPointValue" value={sim.cardPointValue} onChange={handleSimChange} className="w-full border p-2 rounded text-sm bg-gray-50" />
                                            </div>
                                        </div>

                                        <div className="bg-gray-100 p-3 rounded-lg border border-gray-200">
                                            <div className="flex justify-between items-center">
                                                <span className="text-sm font-medium text-gray-700">Total de Pontos Gerados:</span>
                                                <span className="text-lg font-bold text-indigo-600">
                                                    { Math.floor(simCalculatedCardPoints).toLocaleString('pt-BR') }
                                                </span>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-2 mt-2 bg-gray-50 p-2 rounded border">
                                            <input type="checkbox" id="hasAlt" name="hasAltPlatform" checked={sim.hasAltPlatform} onChange={handleSimChange} className="w-4 h-4 accent-indigo-600" />
                                            <label htmlFor="hasAlt" className="text-sm font-medium text-gray-700">Pontos em plataforma parceira?</label>
                                        </div>

                                        {sim.hasAltPlatform && (
                                            <div className="grid grid-cols-2 gap-3 bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                                                <div>
                                                    <label className="block text-[10px] font-bold text-indigo-800 uppercase">Pontos Parceiro</label>
                                                    <input type="number" name="altPoints" value={sim.altPoints} onChange={handleSimChange} className="w-full border-0 p-2 rounded text-sm shadow-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-indigo-800 uppercase">Valor (R$)</label>
                                                    <input type="number" step="0.001" name="altPointValue" value={sim.altPointValue} onChange={handleSimChange} className="w-full border-0 p-2 rounded text-sm shadow-sm" />
                                                </div>
                                            </div>
                                        )}

                                        <div className="border-t pt-4 border-gray-100">
                                            <label className="block text-xs font-bold text-gray-600 uppercase">Desconto à vista / PIX (%)</label>
                                            <input type="number" name="discountPercent" value={sim.discountPercent} onChange={handleSimChange} className="w-full border p-2 rounded text-sm bg-gray-50 mt-1" />
                                        </div>

                                        <div className="border-t pt-4 border-gray-100">
                                            <h3 className="text-xs font-bold text-gray-700 uppercase mb-3"><i className="fas fa-piggy-bank mr-1"></i>Onde seu dinheiro está investido?</h3>
                                            <div className="grid grid-cols-2 gap-3 mb-3">
                                                <div>
                                                    <label className="block text-[10px] font-bold text-gray-500 uppercase">Aplicação</label>
                                                    <input type="text" name="investType" value={sim.investType} onChange={handleSimChange} placeholder="ex: CDI" className="w-full border p-2 rounded text-sm bg-gray-50" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-gray-500 uppercase">Valor (R$)</label>
                                                    <input type="number" name="investAmount" value={sim.investAmount} onChange={handleSimChange} className="w-full border p-2 rounded text-sm bg-gray-50" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-500 uppercase">Rendimento Mensal (%)</label>
                                                <input type="number" step="0.01" name="investYieldRate" value={sim.investYieldRate} onChange={handleSimChange} className="w-full border p-2 rounded text-sm bg-gray-50" />
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section className="bg-indigo-700 text-white p-6 rounded-xl shadow-lg">
                                    <h3 className="text-center text-xs font-bold uppercase tracking-wider opacity-90 mb-2">A Opção Mais Vantajosa é:</h3>
                                    <div className="text-center text-3xl font-black mb-6">{simBestOption}</div>
                                    
                                    <div className="space-y-3 text-sm bg-indigo-800/50 p-4 rounded-lg border border-indigo-500/30">
                                        <div className="flex justify-between items-center border-b border-indigo-500/50 pb-2">
                                            <span className="opacity-90">Custo Real no Cartão:</span>
                                            <span className="font-bold text-lg">{formatCurrency(simCostCard)}</span>
                                        </div>
                                        <div className="flex justify-between items-center pt-1">
                                            <span className="opacity-90">Custo Real à Vista:</span>
                                            <span className="font-bold text-lg">{formatCurrency(simCostCash)}</span>
                                        </div>
                                        <div className="text-[10px] text-indigo-300 leading-tight mt-2 text-center">
                                            *Custo à vista inclui o valor pago com desconto + o rendimento que esse dinheiro deixará de gerar no seu {sim.investType} neste mês.
                                        </div>
                                    </div>
                                    
                                    <div className="text-center mt-5 text-indigo-100 text-sm bg-white/10 p-2 rounded">
                                        Você economiza <span className="font-bold text-white text-base">{formatCurrency(simSavings)}</span> escolhendo essa opção.
                                    </div>
                                </section>
                            </div>
                        )}
                    </main>

                    {selection.active && (
                        <div className="bg-white p-4 shadow-[0_-5px_15px_rgba(0,0,0,0.1)] z-10 animate-fade-in border-t">
                            <div className="flex justify-between items-center mb-3">
                                <span className="font-bold text-sm text-gray-700">{selection.ids.length} compra(s) selecionada(s)</span>
                                <button onClick={() => setSelection({ active: false, ids: [] })} className="text-sm font-semibold text-red-600">Cancelar</button>
                            </div>
                            <div className="flex gap-2">
                                <select id="bulk-card-select" className="flex-1 border p-2 rounded-lg bg-gray-50 text-sm">
                                    <option value="">Mover para o cartão...</option>
                                    {cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                                <button onClick={handleBulkMove} className="bg-blue-600 text-white px-4 rounded-lg font-bold shadow-sm">Mover</button>
                            </div>
                        </div>
                    )}

                    <nav className="bg-white border-t border-gray-200 flex justify-around shadow-[0_-5px_15px_rgba(0,0,0,0.05)] w-full pb-safe">
                        <NavItem id="resumo" icon="fa-chart-pie" label="Resumo" />
                        <NavItem id="cartoes" icon="fa-credit-card" label="Cartões" />
                        <NavItem id="faturas" icon="fa-file-invoice-dollar" label="Faturas" />
                        <NavItem id="fixos" icon="fa-repeat" label="Fixos" />
                        <NavItem id="configuracoes" icon="fa-cog" label="Configurações" />
                        <NavItem id="simulador" icon="fa-calculator" label="Simulador" />
                    </nav>

                    <EditModal 
                        show={editModal.isOpen}
                        item={editModal.item}
                        type={editModal.type}
                        onSave={handleUpdateItem}
                        onClose={() => setEditModal({ isOpen: false, item: null, type: null })}
                        cards={cards}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
